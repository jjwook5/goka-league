<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>제1회 고카 정모 · 팀 대항전</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  body { font-family:'Noto Sans KR',-apple-system,sans-serif; background:#0a1f14; color:#d4e4da; min-height:100vh; padding-bottom:40px; }
  .wrap { max-width:460px; margin:0 auto; padding:0 12px; }
  .hdr { text-align:center; padding:18px 0 10px; }
  .hdr .ti { font-size:11px; color:#8faa97; letter-spacing:1.5px; }
  .hdr h1 { font-size:21px; color:#e8d5a3; margin-top:2px; font-weight:800; }
  .back { position:absolute; left:16px; top:18px; color:#8faa97; text-decoration:none; font-size:13px; }
  .tabs { display:flex; gap:6px; background:#0f2a1c; border-radius:999px; padding:4px; margin:12px 0 16px; }
  .tab { flex:1; border:none; border-radius:999px; padding:9px 0; font-size:13px; font-weight:700; cursor:pointer; background:transparent; color:#8faa97; }
  .tab.active { background:#2d5a3d; color:#e8d5a3; }
  .hint { font-size:11px; color:#5a7f6a; text-align:center; margin-bottom:12px; }
  .tcard { border-radius:12px; background:#12321f; border:1px solid #1e3a2a; margin-bottom:9px; overflow:hidden; border-left:4px solid #666; }
  .trow { display:flex; align-items:center; gap:10px; padding:12px 11px; cursor:pointer; }
  .rankico { width:26px; text-align:center; font-size:15px; font-weight:800; }
  .tbadge { width:36px; height:36px; border-radius:9px; display:flex; align-items:center; justify-content:center; font-weight:800; font-size:14px; }
  .tname { font-size:15px; font-weight:700; color:#eef6f0; }
  .tsub { font-size:11px; color:#5a7f6a; margin-top:1px; }
  .tover { font-size:20px; font-weight:800; line-height:1; }
  .chev { font-size:13px; color:#5a7f6a; transition:transform .2s; margin-left:4px; }
  .roster { display:none; border-top:1px solid #1e3a2a; background:#0d2717; padding:5px 10px 9px; }
  .roster .rlbl { font-size:10px; color:#5a7f6a; padding:6px 6px 3px; }
  .prow { display:flex; justify-content:space-between; align-items:center; padding:6px 6px; font-size:13px; border-bottom:1px solid #14301e; }
  .prow:last-child { border-bottom:none; }
  .pname { color:#d4e4da; } .pnick { color:#7a9b88; font-size:11px; margin-left:4px; }
  .pover { font-weight:700; }
  .empty { text-align:center; padding:50px 20px; color:#5a7f6a; }
  .empty .big { font-size:40px; margin-bottom:14px; }
  .soon { text-align:center; padding:44px 20px; color:#6b8f77; }
  .soon .big { font-size:34px; margin-bottom:12px; }
  .loading { text-align:center; padding:60px; color:#5a7f6a; }
</style>
</head>
<body>
<div class="wrap">
  <a href="index.html" class="back">‹ 앱으로</a>
  <div class="hdr">
    <div class="ti">GOLFriend Since 2026</div>
    <h1>🏆 제1회 고카 정모</h1>
  </div>

  <div class="tabs">
    <button class="tab active" id="t-live" onclick="showTab('live')">라운드 중</button>
    <button class="tab" id="t-final" onclick="showTab('final')">최종 종합</button>
    <button class="tab" id="t-award" onclick="showTab('award')">개인시상</button>
  </div>

  <div id="v-live"><div class="loading">불러오는 중…</div></div>
  <div id="v-final" style="display:none;"></div>
  <div id="v-award" style="display:none;"></div>
</div>

<script>
const SUPABASE_URL = 'https://ogyzzmlxxmplwaawraoc.supabase.co';
const KEY = 'sb_publishable_4lEKf_VDXf7udBOGh-Bggw_ee4UApQd';   /* 공개(publishable) 키 — apikey 헤더에만 */
const MATCH_ID = 20260913;
const BASE_PAR = 72;
const RANK_PTS = [100, 90, 80, 70];
const TEAM_ORDER = ['레드','네이비','화이트','블랙'];
const TEAM_COLORS = {
  '레드':   ['#E24B4A','#3a1414','#f0a0a0'],
  '네이비': ['#378ADD','#0e2540','#9fc4ef'],
  '화이트': ['#b8b6ad','#2a2a26','#e8e6dd'],
  '블랙':   ['#888',   '#232323','#cfcfcf'],
};

let MEMBERS = {}, RECORDS = [], STATUS = '진행중', NEAREST = [];

function sb(table, params='') {
  return fetch(`${SUPABASE_URL}/rest/v1/${table}?select=*${params}`, {
    headers: { apikey: KEY }
  }).then(r => r.json());
}
function nick(phone) {
  const m = MEMBERS[phone];
  return m ? (m['닉네임'] || m['성명']) : phone;
}
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

async function load() {
  try {
    const [mems, recs, eps] = await Promise.all([
      sb('tb_member'),
      sb('tb_Record', `&대회번호=eq.${MATCH_ID}`),
      sb('tb_Match_Episodes', `&대회번호=eq.${MATCH_ID}`)
    ]);
    mems.forEach(m => MEMBERS[m['전화번호']] = m);
    RECORDS = recs || [];
    STATUS = (eps[0] && eps[0]['완료구분']) || '진행중';
    /* 니어리스트: tb_Match_Episodes.니어리스트(전화번호 쉼표구분) → 해당 팀 +10 (최종 종합용) */
    NEAREST = [];
    eps.forEach(e => { if (e['니어리스트']) String(e['니어리스트']).split(',').forEach(p => {
      const ph = p.trim(); if (!ph) return;
      const r = RECORDS.find(x => String(x['전화번호']) === ph);
      if (r) NEAREST.push({ team: r['소속팀'], nick: nick(ph) });
    }); });
    renderLive();
    renderFinal();
    renderAward();
  } catch(e) {
    document.getElementById('v-live').innerHTML = `<div class="empty"><div class="big">⚠️</div>데이터를 불러오지 못했습니다.<br>잠시 후 새로고침 해주세요.</div>`;
  }
}

function gender(phone) {
  const p = String(phone).split('-');
  return p[1] === '2000' ? '여' : '남';
}
function countBirdies(r) {
  let b = 0;
  for (let i = 1; i <= 18; i++) if (Number(r['H'+i]) === -1) b++;
  return b;
}

function renderFinal() {
  const el = document.getElementById('v-final');
  /* 공개 2단계 — 마감: 스트로크 기준 / 완료: 신페까지 전체 */
  if (STATUS === '진행중') {
    el.innerHTML = soonHtml('최종 종합은 라운드 종료 후 공개됩니다', '순위점수 + 메달·신페·버디·니어 합산');
    return;
  }
  const FULL = (STATUS === '완료');
  const played = RECORDS.filter(r => Number(r['합계']) > 0);
  if (played.length === 0) { el.innerHTML = soonHtml('집계 중입니다', ''); return; }

  const teams = {};
  played.forEach(r => {
    const t = r['소속팀']; if (!TEAM_COLORS[t]) return;
    if (!teams[t]) teams[t] = { name:t, gross:0, birdies:0, awards:[], bp:[] };
    teams[t].gross += Number(r['합계']);
    const b = countBirdies(r);
    if (b > 0) { teams[t].birdies += b; teams[t].bp.push({ nick: nick(r['전화번호']), cnt: b }); }
  });
  const add = (team, item) => { if (teams[team]) teams[team].awards.push(item); };

  /* ① 팀 대항 스트로크 — 팀 합산 그로스 낮은 순 */
  Object.values(teams).sort((a,b)=>a.gross-b.gross).forEach((t,i)=>{ t.rankPt = RANK_PTS[i] ?? 0; t.rank = i+1; });

  /* ② 수상 — 동점자는 백카운트까지 적용해 선정 */
  const medal = [...played].sort(cmpStroke)[0];
  add(medal['소속팀'], { l:'메달리스트 '+nick(medal['전화번호']), v:10, ic:'🏅' });

  /* 신페 관련 보너스는 2차 공개(완료) 단계에서만 합산 */
  const npDone = FULL ? played.filter(r => Number(r['NP_Handicap']) > 0) : [];
  if (npDone.length) {
    const males   = npDone.filter(r=>gender(r['전화번호'])==='남').sort(cmpNet);
    const females = npDone.filter(r=>gender(r['전화번호'])==='여').sort(cmpNet);
    if (males.length)   add(males[0]['소속팀'],   { l:'신페 남우승 '+nick(males[0]['전화번호']),   v:10, ic:'🏌️' });
    if (females.length) add(females[0]['소속팀'], { l:'신페 여우승 '+nick(females[0]['전화번호']), v:10, ic:'🏌️‍♀️' });
    const sorted = [...npDone].sort(cmpNet);
    const last = sorted[sorted.length-1];
    add(last['소속팀'], { l:'신페 꼴등 '+nick(last['전화번호']), v:-10, ic:'😢' });
  }

  NEAREST.forEach(n => add(n.team, { l:'니어리스트 '+(n.nick||''), v:10, ic:'🚩' }));

  const list = Object.values(teams).map(t => {
    const aw = t.awards.reduce((s,b)=>s+b.v,0);
    const bd = t.birdies * 5;
    return { ...t, aw, bd, total: t.rankPt + aw + bd };
  }).sort((a,b)=> b.total - a.total || a.gross - b.gross);

  const banner = FULL
    ? `<div class="hint">팀을 누르면 점수 산출 내역이 펼쳐집니다</div>`
    : `<div class="hint" style="color:#e8d5a3;">1차 공개 · 스트로크 기준 중간 집계<br>
        <span style="color:#5a7f6a;">신페 남·여 우승과 꼴등 −10은 시상식에서 합산됩니다</span></div>`;

  el.innerHTML = banner + list.map((t,i) => {
    const [c,bg,tx] = TEAM_COLORS[t.name];
    const trophy = i<3 ? ['🏆','🥈','🥉'][i] : `<span style="color:#5a7f6a;">${i+1}</span>`;
    const pt = v => `<span class="pover" style="color:${v<0?'#ef4444':v>0?'#7fc99a':'#5a7f6a'};">${v>0?'+':''}${v}</span>`;
    const line = (label, v) => `<div class="prow"><span class="pname">${label}</span>${pt(v)}</div>`;

    const awardRows = t.awards.length
      ? t.awards.map(a => line(`${a.ic} ${esc(a.l)}`, a.v)).join('')
      : `<div class="prow"><span class="pname" style="color:#4a6b58;">해당 없음</span><span class="pover" style="color:#4a6b58;">0</span></div>`;

    const birdieRows = t.bp.length
      ? [...t.bp].sort((a,b)=>b.cnt-a.cnt).map(p => line(`${esc(p.nick)} <span style="color:#5a7f6a;">${p.cnt}개</span>`, p.cnt*5)).join('')
      : `<div class="prow"><span class="pname" style="color:#4a6b58;">버디 없음</span><span class="pover" style="color:#4a6b58;">0</span></div>`;

    return `<div class="tcard" style="border-left-color:${c};">
      <div class="trow" onclick="toggleF('${t.name}')">
        <div class="rankico">${trophy}</div>
        <div class="tbadge" style="background:${bg};color:${tx};">${t.name[0]}</div>
        <div style="flex:1;"><div class="tname">${t.name}팀</div>
          <div class="tsub">스트로크 ${t.rankPt} · 수상 ${t.aw>=0?'+':''}${t.aw} · 버디 +${t.bd}</div></div>
        <div style="text-align:right;display:flex;align-items:center;">
          <div><div class="tover" style="color:${c};font-size:23px;">${t.total}</div>
            <div style="font-size:10px;color:#5a7f6a;">총점</div></div>
          <i class="chev" id="chf-${t.name}">▼</i></div>
      </div>
      <div class="roster" id="rsf-${t.name}">
        <div class="rlbl">① 팀 대항 스트로크 — 합산 ${t.gross}타 · ${t.rank}위</div>
        ${line(`팀 순위 <b style="color:#d4e4da;">${t.rank}위</b> 배점`, t.rankPt)}
        <div class="rlbl">② 수상</div>
        ${awardRows}
        <div class="rlbl">③ 버디 — 총 ${t.birdies}개 × 5점 <span style="color:#4a6b58;">(이글은 0점)</span></div>
        ${birdieRows}
        <div class="prow" style="border-top:1px solid #2d5a3d; margin-top:5px; padding-top:9px;">
          <span class="pname" style="font-weight:800; color:#e8d5a3;">합계</span>
          <span class="pover" style="color:${c}; font-size:17px;">${t.rankPt} ${t.aw>=0?'+':'−'} ${Math.abs(t.aw)} + ${t.bd} = <b>${t.total}</b></span>
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggleF(name) {
  const rs = document.getElementById('rsf-'+name), ch = document.getElementById('chf-'+name);
  const open = rs.style.display !== 'block';
  rs.style.display = open ? 'block' : 'none';
  ch.style.transform = open ? 'rotate(180deg)' : 'rotate(0)';
}

function renderLive() {
  const el = document.getElementById('v-live');
  const played = RECORDS.filter(r => Number(r['합계']) > 0);
  if (played.length === 0) {
    el.innerHTML = `<div class="empty"><div class="big">⛳</div><b style="color:#e8d5a3;">9월 13일 대항전 준비 중</b><br><span style="font-size:12px;">라운드가 시작되면 팀 순위가 실시간으로 올라옵니다.</span></div>`;
    return;
  }
  const teams = {};
  played.forEach(r => {
    const t = r['소속팀']; if (!TEAM_COLORS[t]) return;
    if (!teams[t]) teams[t] = { name:t, players:[], over:0 };
    const ov = Number(r['합계']) - BASE_PAR;
    teams[t].players.push({ phone:r['전화번호'], over:ov });
    teams[t].over += ov;
  });
  const list = Object.values(teams).sort((a,b) => a.over - b.over);
  list.forEach((t,i) => t.rankPt = RANK_PTS[i] ?? 0);

  el.innerHTML = `<div class="hint">팀 합산 오버파 · 팀을 누르면 선수별 기록</div>` + list.map((t,i) => {
    const [c,bg,tx] = TEAM_COLORS[t.name];
    const medal = i<3 ? ['🥇','🥈','🥉'][i] : `<span style="color:#5a7f6a;">${i+1}</span>`;
    const roster = [...t.players].sort((a,b)=>a.over-b.over).map(p => `
      <div class="prow"><span class="pname">${esc(nick(p.phone))}</span>
      <span class="pover" style="color:${c};">${p.over>=0?'+':''}${p.over}</span></div>`).join('');
    return `<div class="tcard" style="border-left-color:${c};">
      <div class="trow" onclick="toggle('${t.name}')">
        <div class="rankico">${medal}</div>
        <div class="tbadge" style="background:${bg};color:${tx};">${t.name[0]}</div>
        <div style="flex:1;"><div class="tname">${t.name}팀</div>
          <div class="tsub">합산 ${t.over>=0?'+':''}${t.over} · 순위점수 ${t.rankPt}점 · ${t.players.length}명</div></div>
        <div style="text-align:right;display:flex;align-items:center;">
          <div class="tover" style="color:${c};">${t.over>=0?'+':''}${t.over}</div>
          <i class="chev" id="ch-${t.name}">▼</i></div>
      </div>
      <div class="roster" id="rs-${t.name}"><div class="rlbl">선수별 오버파 (낮은 순)</div>${roster}</div>
    </div>`;
  }).join('');
}

function toggle(name) {
  const rs = document.getElementById('rs-'+name), ch = document.getElementById('ch-'+name);
  const open = rs.style.display !== 'block';
  rs.style.display = open ? 'block' : 'none';
  ch.style.transform = open ? 'rotate(180deg)' : 'rotate(0)';
}
function soonHtml(title, sub) {
  return `<div class="soon"><div class="big">🔒</div><b style="color:#e8d5a3;">${title}</b><br><span style="font-size:12px;">${sub}</span></div>`;
}
function teamBadge(team) {
  const c = TEAM_COLORS[team];
  return c ? `<span style="display:inline-block;width:17px;height:17px;border-radius:4px;background:${c[1]};color:${c[2]};font-size:9px;text-align:center;line-height:17px;font-weight:800;vertical-align:middle;">${team[0]}</span>` : '';
}
function compareBackAward(a, b) {
  for (let i = 18; i >= 10; i--) { const va=Number(a['H'+i])||0, vb=Number(b['H'+i])||0; if (va!==vb) return va-vb; }
  return 0;
}
/* ═══ 동점자 처리 (오름차순 = 잘한 순) ═══
   스트로크 : 합계 낮은 순 → 백카운트
   신페리오 : Net 낮은 순 → 합산 높은 순(재미) → 백카운트
   시상자 선정(메달·신페 남/여 우승·꼴등)도 이 기준을 그대로 사용 */
function cmpStroke(a, b) {
  const g = Number(a['합계']) - Number(b['합계']); if (g) return g;
  return compareBackAward(a, b);
}
function cmpNet(a, b) {
  const n = Number(a['Net_Score']) - Number(b['Net_Score']); if (n) return n;
  const g = Number(b['합계']) - Number(a['합계']); if (g) return g;
  return compareBackAward(a, b);
}
/* 이글(-2 이하)은 버디로 세지 않음 — 팀 보너스도 버디(-1)만 +5 */
function countTypes(r) {
  let e=0,b=0,p=0,bg=0,d=0;
  for (let i=1;i<=18;i++){ const s=Number(r['H'+i]); if(r['H'+i]!=null&&!isNaN(s)){ if(s<=-2)e++; else if(s===-1)b++; else if(s===0)p++; else if(s===1)bg++; else d++; } }
  return {e,b,p,bg,d};
}
function rankColor(rk){ return rk===1?'#e8d5a3':rk===2?'#c0c0c0':rk===3?'#b87333':'#5a7f6a'; }
function nameCell(r) {
  const g = gender(r['전화번호']);
  const gb = `<span style="font-size:9px;color:${g==='여'?'#f0a0a0':'#9fc4ef'};margin-left:4px;">${g}</span>`;
  return `${teamBadge(r['소속팀'])} <span style="color:#d4e4da;">${esc(nick(r['전화번호']))}</span>${gb}`;
}
let AWARD_SUB = 'np';

function awardNP(played) {
  const rows = [...played].sort(cmpNet);   /* Net → 합산 높은 순 → 백카운트 */
  rows.forEach((r,i)=>{ if(i===0){r._rk=1;return;} const p=rows[i-1];
    const same=Number(r['Net_Score'])===Number(p['Net_Score'])&&Number(r['합계'])===Number(p['합계'])&&compareBackAward(r,p)===0;
    r._rk=same?p._rk:i+1; });
  const body=rows.map(r=>{
    const lf=Number(r['Luck_Factor'])||0; const lc=lf>0?'#22c55e':lf<0?'#ef4444':'#8faa97';
    return `<tr style="font-size:12px;border-top:1px solid #14301e;">
      <td style="color:${rankColor(r._rk)};font-weight:800;text-align:center;">${r._rk}</td>
      <td style="text-align:left;padding:7px 4px;">${nameCell(r)}</td>
      <td style="text-align:center;">${Number(r['합계'])}</td>
      <td style="text-align:center;color:#e8d5a3;font-weight:700;">${Number(r['Net_Score']).toFixed(1)}</td>
      <td style="text-align:center;color:#8faa97;">${Number(r['NP_Handicap']).toFixed(1)}</td>
      <td style="text-align:center;color:${lc};">${lf>0?'+':''}${lf.toFixed(1)}</td></tr>`;
  }).join('');
  return `<table style="width:100%;border-collapse:collapse;"><thead><tr style="color:#8faa97;font-size:10px;">
    <th style="width:24px;">#</th><th style="text-align:left;">선수</th><th>합산</th><th>Net</th><th>HDCP</th><th>Luck</th></tr></thead><tbody>${body}</tbody></table>`;
}
function awardStroke(played) {
  const rows=[...played].sort(cmpStroke);   /* 합계 → 백카운트 */
  rows.forEach((r,i)=>{if(i===0){r._sk=1;return;}const p=rows[i-1];const same=Number(r['합계'])===Number(p['합계'])&&compareBackAward(r,p)===0;r._sk=same?p._sk:i+1;});
  const body=rows.map(r=>`<tr style="font-size:12px;border-top:1px solid #14301e;">
    <td style="color:${rankColor(r._sk)};font-weight:800;text-align:center;">${r._sk}</td>
    <td style="text-align:left;padding:7px 4px;">${nameCell(r)}</td>
    <td style="text-align:center;color:#e8d5a3;font-weight:700;">${Number(r['합계'])}타</td></tr>`).join('');
  return `<table style="width:100%;border-collapse:collapse;"><thead><tr style="color:#8faa97;font-size:10px;">
    <th style="width:24px;">#</th><th style="text-align:left;">선수</th><th>그로스</th></tr></thead><tbody>${body}</tbody></table>`;
}
function awardTitle(played) {
  /* 버디는 -1만 카운트(팀 보너스와 동일 기준). 이글은 나온 경우에만 별도 열로 표시 */
  const rows=played.map(r=>({r,...countTypes(r)})).sort((a,b)=>b.b-a.b || b.e-a.e);
  const anyEagle = rows.some(x=>x.e>0);
  const eagleTh = anyEagle ? `<th>🦅이글</th>` : '';
  const body=rows.map((x,i)=>`<tr style="font-size:12px;border-top:1px solid #14301e;">
    <td style="text-align:left;padding:7px 4px;">${i+1}. ${nameCell(x.r)}</td>
    ${anyEagle ? `<td style="text-align:center;color:#a855f7;font-weight:700;">${x.e||''}</td>` : ''}
    <td style="text-align:center;color:#3b82f6;font-weight:700;">${x.b}</td>
    <td style="text-align:center;color:#22c55e;">${x.p}</td>
    <td style="text-align:center;color:#eab308;">${x.bg}</td>
    <td style="text-align:center;color:#ef4444;">${x.d}</td></tr>`).join('');
  return `<table style="width:100%;border-collapse:collapse;"><thead><tr style="color:#8faa97;font-size:10px;">
    <th style="text-align:left;">선수</th>${eagleTh}<th>🐦버디</th><th>파</th><th>보기</th><th>더블+</th></tr></thead><tbody>${body}</tbody></table>`;
}
function renderAward() {
  const el = document.getElementById('v-award');
  if (STATUS === '진행중') { el.innerHTML = soonHtml('개인시상은 라운드 종료 후 공개됩니다', '신페리오 · 스트로크 · 번외타이틀'); return; }
  const FULL = (STATUS === '완료');
  const played = RECORDS.filter(r => Number(r['합계']) > 0);
  if (played.length === 0) { el.innerHTML = soonHtml('집계 중입니다', ''); return; }
  /* 1차 공개(마감)에서는 신페리오 순위를 감춤 */
  const hasHoles = played.some(r => r['H1'] !== null && r['H1'] !== undefined);
  const subs = [];
  if (FULL) subs.push(['np','🎯 신페리오']);
  subs.push(['str','⛳ 스트로크']);
  if (hasHoles) subs.push(['title','🏅 번외타이틀']);   /* 홀별 스코어가 있어야 의미 있음 */
  if (!subs.some(s => s[0] === AWARD_SUB)) AWARD_SUB = 'str';
  let html = FULL ? '' :
    `<div class="hint" style="color:#e8d5a3;">1차 공개 · 스트로크 기준<br>
      <span style="color:#5a7f6a;">🎯 신페리오 순위는 시상식에서 공개됩니다</span></div>`;
  html += `<div style="display:flex;gap:5px;margin-bottom:12px;">`+
    subs.map(([k,l])=>`<button onclick="AWARD_SUB='${k}';renderAward();" style="flex:1;border:none;border-radius:8px;padding:8px 4px;font-size:11px;font-weight:700;cursor:pointer;background:${AWARD_SUB===k?'#2d5a3d':'#0f2a1c'};color:${AWARD_SUB===k?'#e8d5a3':'#8faa97'};white-space:nowrap;">${l}</button>`).join('')+`</div>`;
  html+=`<div class="tcard" style="border-left:none;padding:6px 10px 10px;">`;
  html+= AWARD_SUB==='np' ? awardNP(played) : AWARD_SUB==='str' ? awardStroke(played) : awardTitle(played);
  html+=`</div>`;
  el.innerHTML = html;
}

function showTab(w) {
  ['live','final','award'].forEach(k => {
    document.getElementById('v-'+k).style.display = k===w ? 'block' : 'none';
    document.getElementById('t-'+k).classList.toggle('active', k===w);
  });
}
load();
</script>
